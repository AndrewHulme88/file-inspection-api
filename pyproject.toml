[project]
name = "file-inspection-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi[standard]>=0.141.1",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "openpyxl",
    "pyarrow",
    "xlrd>=2.0.2",
    "odfpy>=1.4.1",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
